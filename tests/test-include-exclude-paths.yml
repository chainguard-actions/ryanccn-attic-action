name: Test attic-action include and exclude paths inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with include-paths and exclude-paths set
        id: action
        uses: .
        continue-on-error: true
        with:
          endpoint: "https://attic.example.invalid"
          cache: "test-cache"
          skip-use: "true"
          skip-push: "true"
          include-paths: |
            /nix/store/.*
          exclude-paths: |
            /nix/store/.*-dev

      - name: Assert action step was executed
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action step was executed (outcome: ${{ steps.action.outcome }})"
          else
            echo "FAIL: action step did not execute properly"
            exit 1
          fi
