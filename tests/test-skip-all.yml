name: Test attic-action with skip-use and skip-push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with skip-use and skip-push enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          endpoint: "https://attic.example.invalid"
          cache: "test-cache"
          skip-use: "true"
          skip-push: "true"

      - name: Assert action step was executed
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action may fail due to no real Attic server, but it must have run
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action step was executed (outcome: ${{ steps.action.outcome }})"
          else
            echo "FAIL: action step did not execute properly"
            exit 1
          fi
