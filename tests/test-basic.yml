name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          endpoint: "https://attic.example.com"
          cache: "my-cache"
          token: "my-secret-token"
          __internal-dry-run: "true"
      - name: Assert action completed
        run: |
          echo "Action completed successfully in dry-run mode"
          echo "PASS"
