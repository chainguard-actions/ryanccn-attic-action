name: Test inputs-from input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          endpoint: "https://attic.example.com"
          cache: "test-cache"
          inputs-from: "/tmp/nixpkgs-input"
          skip-push: "true"
          skip-use: "true"
      - name: Assert action ran with inputs-from input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with inputs-from input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real Attic endpoint)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
